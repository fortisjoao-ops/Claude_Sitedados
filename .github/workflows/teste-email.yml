name: Teste do relatório e do email (temporário)
on:
  push:
    branches: [claude/relatorio-email]
    paths: ['.github/workflows/teste-email.yml']
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Buscar os dados de agora e montar as notícias, só nesta máquina (nada é gravado no repositório)
        env:
          NOTICIAS_TEXTOS: ${{ runner.temp }}/noticias-textos.json
        run: |
          python3 -I atualizar.py site/index.html site/index.html noticias | cut -c1-700
          python3 -c "import json,os;t=json.load(open(os.environ['NOTICIAS_TEXTOS']));print('TEXTOS', len(t), 'materias com texto; tamanhos', sorted(len(v['texto']) for v in t.values()))"
      - name: Resumos editoriais (só se a chave existir)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet anthropic
            "$RUNNER_TEMP/venv/bin/python" resumir_noticias.py site/index.html "$RUNNER_TEMP/noticias-textos.json"
          else
            echo "RESUMOS: sem a chave ANTHROPIC_API_KEY nos segredos"
          fi
      - name: Gerar o Daily Market Briefing com os dados de agora
        run: |
          python3 -I relatorio.py forcar
          pdfinfo site/relatorio-diario.pdf | grep "Pages\|Title"
          pdftotext -f 2 -l 2 -layout site/relatorio-diario.pdf - | head -4 | cut -c1-200
          pdftotext -l 1 -layout site/relatorio-diario.pdf - | grep -i "gina 1 de\|Vera Cruz Data" | cut -c1-200
      - name: Criar o rascunho do email no Brevo, sem enviar
        env:
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
          BREVO_LISTA: '3'
          EMAIL_MODO: rascunho
        run: |
          python3 -I enviar_email.py
# segunda rodada: sem o campo tag, que o plano gratuito do Brevo não aceita
