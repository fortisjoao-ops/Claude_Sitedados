name: Rodada excepcional do relatório (temporário)
# Roda uma vez a rotina completa sobre o main: dados e notícias de agora, resumos, Daily Market Briefing refeito,
# gravação no site e envio do email. Usa o enviar_email.py deste branch, que troca o conteúdo do rascunho de teste.
on:
  push:
    branches: [claude/rodada-excepcional]
    paths: ['.github/workflows/rodada-excepcional.yml']
permissions:
  contents: write
concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false
jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Trazer o script de envio ajustado
        run: |
          git fetch --depth=1 origin claude/rodada-excepcional
          git show FETCH_HEAD:enviar_email.py > "$RUNNER_TEMP/enviar_email.py"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Buscar os dados e montar as notícias
        shell: bash
        env:
          BLS_KEY: ${{ secrets.BLS_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          HISTORICO: site/historico.json
          NOTICIAS_TEXTOS: ${{ runner.temp }}/noticias-textos.json
        run: |
          python3 -I atualizar.py site/index.html site/index.html noticias | tee saida.txt | cut -c1-900
          grep -qE '^(UPDATED|UNCHANGED)' saida.txt
          rm saida.txt
      - name: Escrever os resumos editoriais das notícias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet anthropic
          "$RUNNER_TEMP/venv/bin/python" resumir_noticias.py site/index.html "$RUNNER_TEMP/noticias-textos.json"
      - name: Refazer o Daily Market Briefing de hoje
        run: |
          python3 -I relatorio.py forcar
          pdfinfo site/relatorio-diario.pdf | grep Pages
          cut -c1-160 site/relatorio.json
      - name: Gravar no site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/historico.json site/relatorio-diario.pdf site/relatorio.json
          git commit -m "Dados de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') e Daily Market Briefing refeito"
          git push origin HEAD:main
      - name: Enviar o relatório por email
        env:
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
          BREVO_LISTA: '3'
        run: python3 -I "$RUNNER_TEMP/enviar_email.py"
