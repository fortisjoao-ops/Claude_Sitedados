# Temporário: confere se os dados abertos da CVM respondem a um servidor do GitHub. Sai antes da entrega.
name: Diagnóstico de fontes (temporário)
on:
  push:
    branches: [claude/dolar-calculadora-fiis]
    paths: ['.github/workflows/diagnostico.yml']
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Informes mensais de FII na CVM e curva do dólar na B3
        shell: bash
        run: |
          set +e
          curl -sS -m 120 -A 'curva-dashboard-updater/1.0' -o fii.zip -w 'CVM %{http_code} %{size_download} %{content_type}\n' "https://dados.cvm.gov.br/dados/FII/DOC/INF_MENSAL/DADOS/inf_mensal_fii_$(date -u +%Y).zip"
          unzip -l fii.zip | tail -5
          curl -sS -m 120 -A 'curva-dashboard-updater/1.0' -o dol.json -w 'B3 DOL %{http_code} %{size_download}\n' "https://cotacao.b3.com.br/mds/api/v1/DerivativeQuotation/DOL"
          head -c 200 dol.json; echo
