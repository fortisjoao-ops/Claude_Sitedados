name: Teste do relatório (temporário)
on:
  push:
    branches: [claude/relatorio-diario]
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: google-chrome --version
      - run: python3 -I relatorio.py forcar
      - run: pdfinfo site/relatorio-diario.pdf && pdffonts site/relatorio-diario.pdf | head -12 && cat site/relatorio.json
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio
          path: |
            site/relatorio-diario.pdf
            site/relatorio.json
