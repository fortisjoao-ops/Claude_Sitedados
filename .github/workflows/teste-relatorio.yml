name: Teste do relatório (temporário)
on:
  push:
    branches: [claude/relatorio-diario]
    paths: ['.github/workflows/teste-relatorio.yml']
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 -I relatorio.py forcar
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/relatorio-diario.pdf site/relatorio.json
          git commit -m "Primeira edição do relatório diário, gerada no GitHub"
          git push
