name: Atualizar dados do dashboard

on:
  schedule:
    # Horários em UTC. Brasília = UTC menos 3 horas.
    # O GitHub costuma disparar com cerca de meia hora de atraso e às vezes pula um disparo.
    - cron: '15 11 * * *'          # 8h15 de Brasília, todos os dias: notícias e dados (na prática, perto de 8h45)
    - cron: '45 12 * * 1-5'        # 9h45 de Brasília, dias úteis: na prática roda entre 10h20 e 11h, com o pregão aberto; é a rodada que gera e envia o relatório diário
    - cron: '20 13,17,21 * * 1-5'  # 10h20, 14h20 e 18h20 de Brasília, dias úteis: dados de mercado; monta as notícias e gera o relatório se as rodadas anteriores falharam
    - cron: '50 13 * * 0,6'        # 10h50 de Brasília, sábado e domingo: só monta as notícias se a rodada da manhã falhou
  workflow_dispatch:
    inputs:
      noticias:
        description: Montar também a seleção de notícias
        type: boolean
        default: false
      email_rascunho:
        description: Só criar o rascunho do email do dia no Brevo, sem enviar
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o leitor de PDF usado no boletim da B3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Buscar os dados nas fontes
        shell: bash
        env:
          BLS_KEY: ${{ secrets.BLS_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          MODO: ${{ (github.event.schedule == '15 11 * * *' || inputs.noticias) && 'noticias' || (github.event.schedule == '50 13 * * 0,6' && 'recuperar' || '') }}
          HISTORICO: site/historico.json
        run: |
          python3 -I atualizar.py site/index.html site/index.html $MODO | tee saida.txt
          grep -qE '^(UPDATED|UNCHANGED)' saida.txt
          rm saida.txt

      # Uma vez por dia útil, com as notícias do dia montadas e as cotações de hoje da B3 já gravadas: imprime o relatório em PDF
      # com o Chrome que já vem na máquina do GitHub. Antes da abertura do pregão, em fim de semana e em feriado, não faz nada.
      # Se esta etapa falhar, os dados são gravados do mesmo jeito e a rodada seguinte tenta de novo.
      - name: Gerar o relatório diário em PDF
        continue-on-error: true
        run: python3 -I relatorio.py

      - name: Gravar a página, o histórico e o relatório no repositório
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- site/index.html site/historico.json site/relatorio-diario.pdf site/relatorio.json)" ]; then
            echo "Nenhum dado mudou; nada a gravar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/historico.json
          if [ -f site/relatorio-diario.pdf ] && [ -f site/relatorio.json ]; then git add site/relatorio-diario.pdf site/relatorio.json; fi
          git commit -m "Dados de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push

      # Depois de gravada a edição do dia: manda o email aos inscritos, pelo Brevo, uma vez por edição.
      # Espera o site publicar a edição nova antes de enviar. Sem a chave ou sem o número da lista, não faz nada.
      - name: Enviar o relatório por email
        continue-on-error: true
        env:
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
          BREVO_LISTA: '3'   # número da lista "Relatório diário" no Brevo
          EMAIL_MODO: ${{ inputs.email_rascunho && 'rascunho' || '' }}
        run: python3 -I enviar_email.py
